<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="ad.size" content="width=320,height=480"/>
<title>Cello Kitchen – Match The Pairs</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#241a14;display:flex;align-items:center;justify-content:center}

/* ───── Canvas ───── */
#game{position:relative;width:100vw;height:100vh;max-width:400px;max-height:calc(400px * 1.5);overflow:hidden;background:linear-gradient(180deg,#f28c2c 0%,#e87819 100%);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
@media(min-aspect-ratio:2/3){#game{height:100vh;width:calc(100vh / 1.5)}}
@media(max-aspect-ratio:2/3){#game{width:100vw;height:calc(100vw * 1.5)}}
@media(max-width:420px) and (max-height:750px){#game{border-radius:0;box-shadow:none}}

/* ───── Screens ───── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s,transform .35s}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.96)}

/* ───── Splash Screen ───── */
#splash{background:transparent;z-index:10;padding:0}

/* Background Blurred Board (Translucent Depth of Field) */
.bg-blur-grid{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:84%;height:68%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px;filter:blur(6px);opacity:.38;pointer-events:none;z-index:1}
.bg-blur-tile{background:rgba(225,115,20,.65);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 3px rgba(255,255,255,.3),0 8px 20px rgba(80,25,0,.25)}
.bg-blur-tile img{width:50%;opacity:.32;border-radius:4px}

/* Floating Decorative Products (Perimeter Framed) */
.float-item{position:absolute;z-index:4;pointer-events:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.22));animation:floatAnim 3.2s ease-in-out infinite}
.float-item img{width:100%;height:auto;display:block}

.float-bottle{--rot:-8deg;top:2%;left:4%;width:clamp(28px,7.5vw,38px);animation-delay:0s}
.float-lunchbox{--rot:10deg;top:2%;right:4%;width:clamp(38px,10vw,52px);animation-delay:.6s}
.float-tumbler{--rot:-6deg;top:39%;left:2.5%;width:clamp(28px,7.5vw,38px);animation-delay:1.2s}
.float-bowl{--rot:6deg;top:42%;right:2.5%;width:clamp(40px,10.5vw,54px);animation-delay:1.8s}
.float-pot{--rot:-4deg;bottom:4%;left:3%;width:clamp(46px,12vw,62px);animation-delay:.9s}
.float-mug{--rot:8deg;bottom:4%;right:3.5%;width:clamp(32px,8.5vw,44px);animation-delay:1.5s}

@keyframes floatAnim{0%,100%{transform:translateY(0) rotate(var(--rot))}50%{transform:translateY(-6px) rotate(var(--rot))}}

/* Centered Splash Content Column */
.splash-content{position:relative;z-index:5;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:3.5% 3%}

/* Logo Wrap */
.logo-wrap{background:#fff;border-radius:clamp(14px,3.5vw,18px);padding:clamp(6px,1.8vw,10px) clamp(14px,4vw,22px);box-shadow:0 4px 16px rgba(0,0,0,.14);display:inline-flex;align-items:center;justify-content:center}
.logo-wrap img{height:clamp(34px,8.5vw,52px);width:auto;display:block}

/* Title */
.splash-title{color:#fff;font-size:clamp(15px,4vw,20px);font-weight:700;text-align:center;white-space:nowrap;letter-spacing:-.01em;text-shadow:0 1px 4px rgba(0,0,0,.22);margin:0}

/* Hero Cards Fan */
.hero-cards{position:relative;width:100%;height:clamp(120px,30vw,160px);display:flex;align-items:center;justify-content:center}
.hero-card{position:absolute;aspect-ratio:0.82;border-radius:clamp(12px,3vw,18px);background:linear-gradient(145deg,#fba146 0%,#eb7c1c 100%);border:2px solid rgba(255,255,255,.45);box-shadow:0 8px 24px rgba(120,40,0,.28),0 2px 6px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.hero-card-left{width:clamp(76px,20vw,102px);transform:translate(-38%,6px) rotate(-11deg);z-index:1}
.hero-card-right{width:clamp(76px,20vw,102px);transform:translate(38%,6px) rotate(11deg);z-index:1}
.hero-card-patch{width:58%;aspect-ratio:1;border-radius:clamp(6px,1.5vw,9px);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.hero-card-patch img{width:100%;height:100%;object-fit:contain;opacity:.85;border-radius:6px}

/* Center Animated Card */
.hero-card-center{position:absolute;width:clamp(86px,22.5vw,112px);aspect-ratio:0.82;transform:translate(0,0) rotate(0deg);z-index:4;perspective:800px;-webkit-perspective:800px;background:transparent;border:none;box-shadow:none}
.hero-card-center-inner{position:relative;width:100%;height:100%;border-radius:clamp(12px,3vw,18px);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:centerCardFlipDemo 4.6s ease-in-out infinite}
.hero-card-face{position:absolute;inset:0;border-radius:clamp(12px,3vw,18px);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.hero-card-face-back{background:linear-gradient(145deg,#fba146 0%,#eb7c1c 100%);border:2px solid rgba(255,255,255,.45);box-shadow:0 10px 28px rgba(120,40,0,.32),0 3px 8px rgba(0,0,0,.15)}
.hero-card-face-front{background:#ffffff;transform:rotateY(180deg);-webkit-transform:rotateY(180deg);box-shadow:0 12px 30px rgba(0,0,0,.22);padding:8%}
.hero-card-face-front img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}

@keyframes centerCardFlipDemo{
  0%,18%{transform:rotateY(0deg)}
  24%,68%{transform:rotateY(180deg)}
  76%,100%{transform:rotateY(0deg)}
}

/* Tutorial Hand */
.tutorial-hand-wrap{position:absolute;right:-12px;bottom:-22px;width:clamp(44px,11vw,56px);height:clamp(44px,11vw,56px);z-index:10;pointer-events:none;animation:tutorialHandTap 4.6s ease-in-out infinite}
.tutorial-hand{width:100%;height:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.32))}

@keyframes tutorialHandTap{
  0%{transform:translate(28px,35px) scale(.9);opacity:0}
  14%{transform:translate(2px,4px) scale(1);opacity:1}
  20%{transform:translate(-2px,-2px) scale(.86);opacity:1}
  26%{transform:translate(2px,2px) scale(1);opacity:1}
  38%{transform:translate(18px,24px) scale(.95);opacity:.85}
  50%,100%{transform:translate(35px,45px) scale(.9);opacity:0}
}

/* Floating "+100" Score Pop */
.hero-score-float{position:absolute;top:-26px;left:50%;transform:translateX(-50%);color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:800;font-size:clamp(16px,4.5vw,22px);text-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;z-index:8;animation:scoreFloatDemo 4.6s ease-in-out infinite}

@keyframes scoreFloatDemo{
  0%,20%{opacity:0;transform:translate(-50%,6px) scale(.7)}
  25%{opacity:1;transform:translate(-50%,-2px) scale(1.15)}
  32%{opacity:1;transform:translate(-50%,-8px) scale(1)}
  55%{opacity:.9;transform:translate(-50%,-14px) scale(.95)}
  65%,100%{opacity:0;transform:translate(-50%,-22px) scale(.9)}
}

/* Match Label */
.match-label{background:linear-gradient(180deg,#dc7e28 0%,#bd6114 100%);border:1.5px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:clamp(11px,2.8vw,13.5px);padding:clamp(6px,1.5vw,8px) clamp(18px,5vw,26px);border-radius:999px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 4px 14px rgba(130,50,0,.22)}

/* Instruction */
.instruction{background:#7d3305;color:#fff;font-size:clamp(10px,2.5vw,12.5px);font-weight:500;line-height:1.35;padding:clamp(7px,1.8vw,10px) clamp(14px,4vw,20px);border-radius:clamp(9px,2.2vw,13px);text-align:center;max-width:86%;box-shadow:0 4px 12px rgba(0,0,0,.16)}

/* CTA Button */
.cta-btn{display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(13.5px,3.6vw,17px);color:#1a1a1a;background:#fff;border:none;border-radius:999px;padding:clamp(11px,2.9vw,15px) clamp(34px,9vw,48px);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.16);text-transform:uppercase;letter-spacing:.1em;transition:transform .15s,box-shadow .15s}
.cta-btn:active{transform:scale(.96)}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.pulse{animation:pulse 2s ease-in-out infinite}

/* ───── Game Screen ───── */
/* ───── Game Screen ───── */
#gameplay{background:linear-gradient(180deg,#f28c2c 0%,#e87819 100%);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4% 3% 3%}

/* Top Bar / HUD */
.hud{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 1%}
.hud-left{display:flex;align-items:center}
.hud-right{display:flex;align-items:center;gap:6px}
.hud-logo{background:#fff;border-radius:12px;padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hud-logo img{height:clamp(22px,5.5vw,32px);display:block}
.objective{background:#1f1f1f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:clamp(12px,3.2vw,15px);padding:6px 16px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.2);text-align:center;letter-spacing:-.01em}
.score-display{background:#e67d26;border:1.5px solid rgba(255,255,255,.3);border-radius:12px;padding:5px 12px;font-weight:800;font-size:clamp(13px,3.6vw,17px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15);min-width:clamp(40px,11vw,55px);text-align:center}
.sound-toggle{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;transition:transform .15s,background .15s;padding:0}
.sound-toggle:active{transform:scale(.9)}

/* Board framed in dark brown border */
.board{background:#4a2610;border:3px solid #5d3115;border-radius:clamp(16px,4vw,22px);padding:clamp(8px,2vw,12px);width:92%;max-width:340px;aspect-ratio:3/4;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(6px,1.6vw,10px);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 0 2px 8px rgba(0,0,0,.25);margin:auto 0}

/* Cards */
.card{perspective:800px;-webkit-perspective:800px;cursor:pointer;position:relative}
.card-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.2,.2,1);-webkit-transform-style:preserve-3d;transform-style:preserve-3d;border-radius:clamp(10px,2.5vw,14px)}
.card.flipped .card-inner{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:clamp(10px,2.5vw,14px);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* Card back */
.card-back{background:linear-gradient(145deg,#fba146 0%,#eb7c1c 100%);border:2px solid rgba(255,255,255,.35);box-shadow:0 3px 10px rgba(0,0,0,.14);opacity:1;transition:opacity .15s}
.card-back-inner{width:56%;height:56%;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-back-inner img{width:100%;height:100%;object-fit:contain;opacity:.85;border-radius:4px}

/* Card front */
.card-front{background:#ffffff;transform:rotateY(180deg);-webkit-transform:rotateY(180deg);padding:8%;box-shadow:0 3px 10px rgba(0,0,0,.1);opacity:0;transition:opacity .15s}
.card-front img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.12))}

.card.flipped .card-front{opacity:1}
.card.flipped .card-back{opacity:0}

/* Matched */
.card.matched .card-inner{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.card.matched .card-front{background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.6)}
@keyframes matchPop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
.card.match-anim .card-inner{animation:matchPop .4s ease}

/* Bottom Timer */
.bottom-timer-wrap{width:90%;display:flex;flex-direction:column;align-items:center;margin-top:auto}
.timer-bar-wrap{width:100%;height:8px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;position:relative}
.timer-bar{height:100%;background:#ffffff;border-radius:10px;transition:width .3s linear;width:100%}
.timer-bar.low{background:#ff4444}
.timer-label{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(11px,3vw,14px);color:#ffffff;text-shadow:0 1px 3px rgba(0,0,0,.25);margin-top:6px}

/* ───── End Screen ───── */
#endscreen{background:transparent;z-index:15;padding:0}
.end-content{position:relative;z-index:5;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:4% 3%}

/* End Background 3x4 blurred grid */
.end-bg-grid{grid-template-rows:repeat(4,1fr);height:74%;top:13%;filter:blur(8px);opacity:.28}

/* Score Pill */
.end-score-pill{background:linear-gradient(180deg,#ea8329 0%,#cb6a1a 100%);border:1.5px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:clamp(11.5px,3vw,14px);padding:clamp(6px,1.6vw,8px) clamp(22px,6vw,30px);border-radius:999px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 4px 14px rgba(130,50,0,.25)}

/* Hero Two Cards */
.end-hero-cards{position:relative;width:100%;height:clamp(125px,32vw,165px);display:flex;align-items:center;justify-content:center}
.end-card{position:absolute;aspect-ratio:0.82;border-radius:clamp(14px,3.5vw,18px);background:#ffffff;box-shadow:0 10px 28px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.end-card-product{width:clamp(82px,21vw,108px);transform:translate(-24%,0) rotate(-6deg);z-index:1;padding:8%}
.end-card-product img{width:85%;height:85%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
.end-card-score{width:clamp(86px,22vw,112px);transform:translate(24%,2px) rotate(6deg);z-index:2;color:#e6761c;font-family:'Poppins',sans-serif;font-weight:800;font-size:clamp(32px,8.5vw,46px);line-height:1}

/* End Subtext */
.end-subtext{background:#7d3305;color:#fff;font-size:clamp(10.5px,2.6vw,13px);font-weight:500;padding:clamp(6px,1.6vw,8px) clamp(16px,4.5vw,22px);border-radius:clamp(8px,2vw,11px);text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.16)}

/* End Actions Row (Side by side!) */
.end-actions{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,16px);width:100%}
.end-replay{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(12px,3.1vw,14px);color:#fff;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.88);border-radius:12px;padding:clamp(10px,2.6vw,13px) clamp(16px,4.2vw,22px);cursor:pointer;transition:transform .15s;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.end-replay:active{transform:scale(.96)}

.end-cta{display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(13px,3.4vw,15.5px);color:#6a2800;background:#ffffff;border:none;border-radius:12px;padding:clamp(11px,2.8vw,14px) clamp(22px,5.8vw,30px);cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.end-cta:active{transform:scale(.96)}

/* Sound Toggle Button */
.sound-toggle{position:absolute;top:10px;right:10px;z-index:35;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;line-height:1;transition:transform .15s,background .15s;padding:0}
.sound-toggle:active{transform:scale(.9)}

/* ───── Confetti ───── */
.confetti-container{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti-piece{position:absolute;width:8px;height:8px;top:-10px;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotateZ(0deg);opacity:1}100%{transform:translateY(110vh) rotateZ(720deg);opacity:0}}

/* ───── Peek overlay ───── */
.peek-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:5;opacity:0;pointer-events:none;transition:opacity .3s}
.peek-overlay.active{opacity:1;pointer-events:auto}
.peek-text{color:#fff;font-weight:800;font-size:clamp(22px,6vw,36px);text-shadow:0 2px 8px rgba(0,0,0,.4);text-align:center;padding:16px 24px;background:rgba(0,0,0,.3);border-radius:16px}
</style>
</head>
<body>
<div id="game">
  <!-- ═══════ SPLASH ═══════ -->
  <div id="splash" class="screen">
    <!-- Blurred Background Board -->
    <div class="bg-blur-grid">
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
    </div>

    <!-- Floating products (clean 6-point perimeter from OG) -->
    <div class="float-item float-bottle"><img src="{{tile1_data}}" alt=""/></div>
    <div class="float-item float-lunchbox"><img src="{{tile2_data}}" alt=""/></div>
    <div class="float-item float-tumbler"><img src="{{tile3_data}}" alt=""/></div>
    <div class="float-item float-bowl"><img src="{{tile4_data}}" alt=""/></div>
    <div class="float-item float-pot"><img src="{{tile5_data}}" alt=""/></div>
    <div class="float-item float-mug"><img src="{{tile6_data}}" alt=""/></div>

    <!-- Centered Content Column -->
    <div class="splash-content">
      <div class="logo-wrap"><img src="{{logo_data}}" alt="Cello"/></div>
      <h1 class="splash-title">Remember Every Cello Piece</h1>

      <div class="hero-cards">
        <div class="hero-score-float">+100</div>

        <div class="hero-card hero-card-left">
          <div class="hero-card-patch"><img src="{{logo_data}}" alt=""/></div>
        </div>

        <div class="hero-card-center">
          <div class="hero-card-center-inner">
            <div class="hero-card-face hero-card-face-back">
              <div class="hero-card-patch"><img src="{{logo_data}}" alt=""/></div>
            </div>
            <div class="hero-card-face hero-card-face-front">
              <img src="{{tile1_data}}" alt=""/>
            </div>
          </div>
          <div class="tutorial-hand-wrap">
            <svg class="tutorial-hand" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M42 22C42 16.5 46.5 12 52 12C57.5 12 62 16.5 62 22V50C62 52 64 53 66 51C68 49 74 49 76 53C78 57 74 61 72 63L68 67C64 71 62 76 62 82V90H36V78C36 74 34 70 30 66L24 60C20 56 22 50 26 48C30 46 36 50 38 54L42 58V22Z" fill="#ffcc99" stroke="#331800" stroke-width="4" stroke-linejoin="round"/>
              <path d="M34 82H64V94H34V82Z" fill="#ffffff" stroke="#331800" stroke-width="4"/>
            </svg>
          </div>
        </div>

        <div class="hero-card hero-card-right">
          <div class="hero-card-patch"><img src="{{logo_data}}" alt=""/></div>
        </div>
      </div>

      <div class="match-label">MATCH THE PAIRS</div>
      <div class="instruction">Peek, then tap two cards to pair matching Cello pieces.</div>
      <button class="cta-btn pulse" id="startBtn">TAP TO PLAY</button>
    </div>
  </div>

  <!-- ═══════ GAMEPLAY ═══════ -->
  <div id="gameplay" class="screen hidden">
    <div class="hud">
      <div class="hud-left">
        <div class="hud-logo"><img src="{{logo_data}}" alt="Cello"/></div>
      </div>
      <div class="objective">Find every pair!</div>
      <div class="hud-right">
        <div class="score-display" id="scoreDisplay">0</div>
        <button class="sound-toggle" id="soundToggle" aria-label="Toggle Sound" title="Sound On/Off">🔊</button>
      </div>
    </div>

    <div class="board" id="board"></div>

    <div class="bottom-timer-wrap">
      <div class="timer-bar-wrap">

    <!-- Peek countdown overlay -->
    <div class="peek-overlay" id="peekOverlay">

  <!-- ═══════ END SCREEN ═══════ -->
  <div id="endscreen" class="screen hidden">
    <div class="confetti-container" id="confetti"></div>

    <!-- Blurred Background Board -->
    <div class="bg-blur-grid end-bg-grid">
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>
      <div class="bg-blur-tile"><img src="{{logo_data}}" alt=""/></div>

    <!-- Centered Content Column -->
    <div class="end-content">
      <div class="logo-wrap"><img src="{{logo_data}}" alt="Cello"/></div>

      <div class="end-score-pill">YOUR SCORE</div>

      <!-- Hero Two Cards (Overlapping) -->
      <div class="end-hero-cards">
        <div class="end-card end-card-product">
          <img src="{{tile1_data}}" id="endHeroImg" alt=""/>
        </div>
        <div class="end-card end-card-score">
          <span id="finalScore">0</span>
        </div>
      </div>

      <div class="end-subtext">Match Every Cello Piece</div>

      <!-- Action Buttons (Side by Side) -->
      <div class="end-actions">
        <button class="end-replay" id="replayBtn">PLAY AGAIN</button>
        <button class="end-cta pulse" id="ctaBtn">CLICK HERE</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ═══════ CONFIG ═══════ */
var LANDING = "https://celloworld.com/";
var TIMER_SECONDS = 45;
var PEEK_SECONDS = 3;
var POINTS_PER_MATCH = 100;
var BONUS_PER_SECOND = 10;

/* ═══════ TILE DATA ═══════ */
var TILES = [
  {id:1,src:"{{tile1_data}}"},
  {id:2,src:"{{tile2_data}}"},
  {id:3,src:"{{tile3_data}}"},
  {id:4,src:"{{tile4_data}}"},
  {id:5,src:"{{tile5_data}}"},
  {id:6,src:"{{tile6_data}}"}
];

/* ═══════ STATE ═══════ */
var score = 0;
var matchCount = 0;
var flipped = [];
var lockBoard = false;
var timerInterval = null;
var timeLeft = TIMER_SECONDS;

/* ═══════ DOM ═══════ */
var splash = document.getElementById("splash");
var gameplay = document.getElementById("gameplay");
var endscreen = document.getElementById("endscreen");
var board = document.getElementById("board");
var scoreDisplay = document.getElementById("scoreDisplay");
var timerBar = document.getElementById("timerBar");
var timerLabel = document.getElementById("timerLabel");
var peekOverlay = document.getElementById("peekOverlay");
var peekText = document.getElementById("peekText");
var finalScore = document.getElementById("finalScore");
var endHeroImg = document.getElementById("endHeroImg");
var confettiEl = document.getElementById("confetti");
var soundToggle = document.getElementById("soundToggle");
var lastMatchedTileSrc = null;

/* ═══════ PLAYFUL AUDIO SYNTHESIZER (Web Audio API) ═══════ */
var audioCtx = null;
var soundEnabled = true;

function initAudio(){
  if(!audioCtx){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    } catch(e){}
  }
  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

// UI Bubble Pop
function sfxPop(freq){
  if(!audioCtx || !soundEnabled) return;
  var f = freq || 480;
  var now = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(f, now);
  osc.frequency.exponentialRampToValueAtTime(f * 1.8, now + 0.04);
  osc.frequency.exponentialRampToValueAtTime(f * 0.5, now + 0.09);
  gain.gain.setValueAtTime(0.18, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.09);
}

// Playful Card Flip (wooden pop + whoosh snap)
function sfxFlip(){
  if(!audioCtx || !soundEnabled) return;
  var now = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(260, now);
  osc.frequency.exponentialRampToValueAtTime(680, now + 0.06);
  gain.gain.setValueAtTime(0.22, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.07);

  var osc2 = audioCtx.createOscillator();
  var gain2 = audioCtx.createGain();
  osc2.type = "sine";
  osc2.frequency.setValueAtTime(1200, now);
  gain2.gain.setValueAtTime(0.08, now);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);
  osc2.start(now);
  osc2.stop(now + 0.03);
}

// Cheerful Match Chime (Sparkling major arpeggio C-E-G-C)
function sfxMatch(){
  if(!audioCtx || !soundEnabled) return;
  var notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach(function(freq, i){
    setTimeout(function(){
      if(!audioCtx || !soundEnabled) return;
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.28);

      var oscH = audioCtx.createOscillator();
      var gainH = audioCtx.createGain();
      oscH.type = "triangle";
      oscH.frequency.setValueAtTime(freq * 2, now);
      gainH.gain.setValueAtTime(0.08, now);
      gainH.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      oscH.connect(gainH);
      gainH.connect(audioCtx.destination);
      oscH.start(now);
      oscH.stop(now + 0.16);
    }, i * 55);
  });
}

// Cute Mismatch / Wobble
function sfxFail(){
  if(!audioCtx || !soundEnabled) return;
  var now = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(320, now);
  osc.frequency.linearRampToValueAtTime(260, now + 0.1);
  osc.frequency.linearRampToValueAtTime(200, now + 0.22);
  gain.gain.setValueAtTime(0.18, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.24);
}

// Countdown Tick (bubbly woodblock)
function sfxTick(pitch){
  sfxPop(pitch || 600);
}

// "GO!" Upbeat Fanfare
function sfxGo(){
  if(!audioCtx || !soundEnabled) return;
  var notes = [587.33, 880, 1174.66];
  notes.forEach(function(freq, i){
    setTimeout(function(){
      if(!audioCtx || !soundEnabled) return;
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    }, i * 60);
  });
}

// Celebratory Victory Jingle
function sfxWin(){
  if(!audioCtx || !soundEnabled) return;
  var fanfare = [
    {f: 392.00, d: 90,  t: 0},
    {f: 523.25, d: 90,  t: 100},
    {f: 659.25, d: 90,  t: 200},
    {f: 783.99, d: 140, t: 300},
    {f: 659.25, d: 100, t: 450},
    {f: 1046.50,d: 380, t: 560}
  ];
  fanfare.forEach(function(item){
    setTimeout(function(){
      if(!audioCtx || !soundEnabled) return;
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(item.f, now);
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (item.d / 1000));
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + (item.d / 1000));

      var osc2 = audioCtx.createOscillator();
      var gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(item.f * 2, now);
      gain2.gain.setValueAtTime(0.08, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + (item.d / 1000) * 0.7);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now);
      osc2.stop(now + (item.d / 1000));
    }, item.t);
  });
}

// Game End / Time Out Chime
function sfxEnd(){
  if(!audioCtx || !soundEnabled) return;
  var notes = [440, 392, 349.23];
  notes.forEach(function(freq, i){
    setTimeout(function(){
      if(!audioCtx || !soundEnabled) return;
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.22);
    }, i * 90);
  });
}

/* ═══════ PLAYFUL BACKGROUND MUSIC (BGM) ═══════ */
var bgmGainNode = null;
var bgmTimer = null;
var bgmStep = 0;
var BGM_TEMPO = 0.26; // ~115 BPM
var BGM_BASE_VOL = 0.05;

var BGM_MELODY = [
  523.25, 0, 659.25, 0, 783.99, 0, 659.25, 0,
  587.33, 0, 783.99, 0, 659.25, 0, 587.33, 0,
  659.25, 0, 880.00, 0, 783.99, 0, 659.25, 0,
  698.46, 659.25, 587.33, 0, 523.25, 0, 0, 0
];

var BGM_BASS = [
  130.81, 0, 196.00, 0, 130.81, 0, 196.00, 0,
  98.00,  0, 146.83, 0, 98.00,  0, 146.83, 0,
  110.00, 0, 164.81, 0, 110.00, 0, 164.81, 0,
  87.31,  0, 130.81, 0, 98.00,  0, 196.00, 0
];

function playBgmNote(freq, isBass, time){
  if(!audioCtx || !bgmGainNode || !soundEnabled || !freq) return;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = isBass ? "triangle" : "sine";
  osc.frequency.setValueAtTime(freq, time);
  
  var v = isBass ? 0.35 : 0.45;
  var dur = isBass ? 0.2 : 0.16;
  gain.gain.setValueAtTime(v, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  
  osc.connect(gain);
  gain.connect(bgmGainNode);
  osc.start(time);
  osc.stop(time + dur);
}

function startBGM(){
  if(!audioCtx) return;
  if(!bgmGainNode){
    bgmGainNode = audioCtx.createGain();
    bgmGainNode.gain.setValueAtTime(soundEnabled ? BGM_BASE_VOL : 0, audioCtx.currentTime);
    bgmGainNode.connect(audioCtx.destination);
  }
  if(bgmTimer) return;
  bgmStep = 0;
  
  bgmTimer = setInterval(function(){
    if(!audioCtx || !soundEnabled) return;
    var now = audioCtx.currentTime;
    var mFreq = BGM_MELODY[bgmStep];
    var bFreq = BGM_BASS[bgmStep];
    if(mFreq) playBgmNote(mFreq, false, now);
    if(bFreq) playBgmNote(bFreq, true, now);
    
    // gentle woodblock/hi-hat click on offbeats
    if(bgmStep % 2 === 1){
      var clickOsc = audioCtx.createOscillator();
      var clickGain = audioCtx.createGain();
      clickOsc.type = "sine";
      clickOsc.frequency.setValueAtTime(1400, now);
      clickGain.gain.setValueAtTime(0.08, now);
      clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
      clickOsc.connect(clickGain);
      clickGain.connect(bgmGainNode);
      clickOsc.start(now);
      clickOsc.stop(now + 0.02);
    }
    
    bgmStep = (bgmStep + 1) % BGM_MELODY.length;
  }, BGM_TEMPO * 1000);
}

function stopBGM(){
  if(bgmTimer){
    clearInterval(bgmTimer);
    bgmTimer = null;
  }
}

function dimBGM(){
  if(bgmGainNode && audioCtx){
    bgmGainNode.gain.setValueAtTime(soundEnabled ? 0.015 : 0, audioCtx.currentTime);
  }
}

function resumeBGMVol(){
  if(bgmGainNode && audioCtx){
    bgmGainNode.gain.setValueAtTime(soundEnabled ? BGM_BASE_VOL : 0, audioCtx.currentTime);
  }
}

/* ═══════ HELPERS ═══════ */
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function show(el){el.classList.remove("hidden")}
function hide(el){el.classList.add("hidden")}

/* ═══════ BUILD BOARD ═══════ */
function buildBoard(){
  board.innerHTML = "";
  var pairs = [];
  TILES.forEach(function(t){pairs.push({id:t.id,src:t.src});pairs.push({id:t.id,src:t.src});});
  shuffle(pairs);
  pairs.forEach(function(p,i){
    var card = document.createElement("div");
    card.className = "card";
    card.dataset.id = p.id;
    card.dataset.index = i;
    card.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-back"><div class="card-back-inner"><img src="{{logo_data}}" alt=""/></div></div>' +
        '<div class="card-face card-front"><img src="' + p.src + '" alt=""/></div>' +
      '</div>';
    card.addEventListener("click", onCardClick);
    board.appendChild(card);
  });
}

/* ═══════ PEEK PHASE ═══════ */
function peekPhase(){
  // Show all cards face-up
  var cards = board.querySelectorAll(".card");
  cards.forEach(function(c){c.classList.add("flipped")});
  peekOverlay.classList.add("active");

  var count = PEEK_SECONDS;
  peekText.textContent = "Memorise! " + count;
  sfxTick(520);
  var iv = setInterval(function(){
    count--;
    if(count > 0){
      peekText.textContent = "Memorise! " + count;
      sfxTick(520 + (PEEK_SECONDS - count) * 90);
    } else {
      clearInterval(iv);
      peekText.textContent = "GO!";
      sfxGo();
      setTimeout(function(){
        cards.forEach(function(c){c.classList.remove("flipped")});
        peekOverlay.classList.remove("active");
        startTimer();
      },400);
    }
  },1000);
}

/* ═══════ TIMER ═══════ */
function startTimer(){
  timeLeft = TIMER_SECONDS;
  updateTimerUI();
  timerInterval = setInterval(function(){
    timeLeft--;
    updateTimerUI();
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      endGame(false);
    }
  },1000);
}

function updateTimerUI(){
  var pct = (timeLeft / TIMER_SECONDS) * 100;
  timerBar.style.width = pct + "%";
  timerLabel.textContent = timeLeft + "s";
  if(pct < 25) timerBar.classList.add("low");
  else timerBar.classList.remove("low");
}

/* ═══════ CARD CLICK ═══════ */
function onCardClick(){
  if(lockBoard) return;
  var card = this;
  if(card.classList.contains("flipped") || card.classList.contains("matched")) return;

  initAudio();
  sfxFlip();
  card.classList.add("flipped");
  flipped.push(card);

  if(flipped.length === 2){
    lockBoard = true;
    checkMatch();
  }
}

function checkMatch(){
  var a = flipped[0], b = flipped[1];
  if(a.dataset.id === b.dataset.id && a.dataset.index !== b.dataset.index){
    // Match!
    sfxMatch();
    score += POINTS_PER_MATCH;
    matchCount++;
    scoreDisplay.textContent = score;

    var frontImg = a.querySelector(".card-front img");
    if(frontImg) lastMatchedTileSrc = frontImg.src;

    a.classList.add("matched","match-anim");
    b.classList.add("matched","match-anim");
    setTimeout(function(){a.classList.remove("match-anim");b.classList.remove("match-anim")},400);

    flipped = [];
    lockBoard = false;

    if(matchCount === TILES.length){
      // All matched! Bonus
      score += timeLeft * BONUS_PER_SECOND;
      scoreDisplay.textContent = score;
      clearInterval(timerInterval);
      setTimeout(function(){endGame(true)},600);
    }
  } else {
    // No match
    sfxFail();
    setTimeout(function(){
      a.classList.remove("flipped");
      b.classList.remove("flipped");
      flipped = [];
      lockBoard = false;
    },700);
  }
}

/* ═══════ END GAME ═══════ */
function endGame(won){
  dimBGM();
  if(won) sfxWin(); else sfxEnd();
  hide(gameplay);
  show(endscreen);

  finalScore.textContent = score;
  if(endHeroImg && lastMatchedTileSrc){
    endHeroImg.src = lastMatchedTileSrc;
  }
  spawnConfetti();
}

/* ═══════ CONFETTI ═══════ */
function spawnConfetti(){
  confettiEl.innerHTML = "";
  var colors = ["#ef8829","#fff","#8B3700","#FFD700","#ff6b6b","#4ecdc4"];
  for(var i=0;i<50;i++){
    var p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random()*100+"%";
    p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.5+Math.random()*2)+"s";
    p.style.animationDelay = Math.random()*1.5+"s";
    p.style.width = (6+Math.random()*6)+"px";
    p.style.height = (6+Math.random()*6)+"px";
    confettiEl.appendChild(p);
  }
}

/* ═══════ RESET ═══════ */
function resetGame(){
  score = 0;
  matchCount = 0;
  flipped = [];
  lockBoard = false;
  timeLeft = TIMER_SECONDS;
  scoreDisplay.textContent = "0";
  timerBar.style.width = "100%";
  timerBar.classList.remove("low");
  timerLabel.textContent = TIMER_SECONDS+"s";
  if(timerInterval) clearInterval(timerInterval);
  buildBoard();
}

/* ═══════ META PLAYABLE AD CTA (App Store / Store Action) ═══════ */
function onCTAClick(){
  if(typeof FbPlayableAd !== "undefined"){
    FbPlayableAd.onCTAClick();
  } else {
    try {
      FbPlayableAd.onCTAClick();
    } catch(e) {
      window.open(LANDING, "_blank");
    }
  }
}

/* ═══════ EVENT LISTENERS ═══════ */
document.getElementById("startBtn").addEventListener("click",function(){
  initAudio();
  sfxPop(520);
  startBGM();
  hide(splash);
  show(gameplay);
  buildBoard();
  peekPhase();
});

document.getElementById("replayBtn").addEventListener("click",function(){
  initAudio();
  sfxPop(520);
  resumeBGMVol();
  startBGM();
  hide(endscreen);
  show(gameplay);
  resetGame();
  peekPhase();
});

document.getElementById("ctaBtn").addEventListener("click",function(){
  initAudio();
  sfxPop(640);
  onCTAClick();
});

if(soundToggle){
  soundToggle.addEventListener("click",function(e){
    e.stopPropagation();
    initAudio();
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
    if(bgmGainNode && audioCtx){
      bgmGainNode.gain.setValueAtTime(soundEnabled ? BGM_BASE_VOL : 0, audioCtx.currentTime);
    }
    if(soundEnabled){
      sfxPop(600);
      startBGM();
    }
  });
}

})();
</script>
</body>
